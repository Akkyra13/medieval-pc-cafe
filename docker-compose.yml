services:
  app:
    build: .
    container_name: medieval-billing
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    container_name: medieval-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
      node:
        condition: service_completed_successfully

  db:
    image: postgres:16
    container_name: medieval-db
    environment:
        POSTGRES_DB: medieval-pc
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: pgsql123
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Temporary container: builds the front-end assets on every "up", then exits
  node:
    image: node:22
    working_dir: /var/www/html
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}" # Run as your host user so node_modules and public/build are not owned by root
    volumes:
      - ./:/var/www/html
    command: sh -c "npm ci && npm run build && rm -f public/hot" # A leftover public/hot would make pages load assets from a Vite dev server

volumes:
  db_data:

